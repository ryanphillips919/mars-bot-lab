name: Mini Mars tests
on:
  pull_request:
  push:
    branches:
      - research/construction-expansion-20261023
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Mini Mars tests
        run: python3 -m unittest discover -s mini_mars/tests -v
      - name: Run integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Construction study smoke
        run: python3 -m mini_mars.runner.construction_study screen --case-limit 1 --candidate coordinated-planned-build --matches 1 --output /tmp/construction-smoke.json
